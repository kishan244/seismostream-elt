[project]
name = "target-alert"
version = "0.1.0"
description = "Singer target that fires alerts for significant earthquakes, built with the Meltano SDK"
requires-python = ">=3.9"
dependencies = ["singer-sdk>=0.40", "requests>=2.31"]

[project.scripts]
target-alert = "target_alert.target:TargetAlert.cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["target_alert"]