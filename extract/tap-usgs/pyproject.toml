[project]
name = "tap-usgs"
version = "0.1.0"
description = "Singer tap for USGS earthquake data, built with the Meltano SDK"
requires-python = ">=3.9"
dependencies = ["singer-sdk>=0.40"]

[project.scripts]
tap-usgs = "tap_usgs.tap:TapUSGS.cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tap_usgs"]